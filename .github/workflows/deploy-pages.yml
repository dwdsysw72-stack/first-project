# Builds the portfolio sites and publishes them to GitHub Pages.
# Luna (English) is served at https://dwdsysw72-stack.github.io/first-project/luna/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pizzeria-luna-en/package-lock.json

      - name: Build Luna (English)
        working-directory: pizzeria-luna-en
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/luna
          cp -r pizzeria-luna-en/dist/. _site/luna/
          # Root sends visitors straight to Luna
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./luna/">
          <link rel="canonical" href="./luna/">
          <title>Luna</title>
          <a href="./luna/">Luna</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
